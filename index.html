<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>منصة صيانة الجيمي</title>

  <link rel="icon" type="image/png" href="نظام الإجازات.png">
  <link rel="apple-touch-icon" href="نظام الإجازات.png">
  <style>
    /* إزالة الحواف البيضاء ليكون الـ iframe ممتداً بالكامل */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f7;
    }
  </style>
</head>
<body>
  
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyYKSbnLfB4MgVWYnKJtI6jpDMVSbN_92phzmThu5JkJHdjthipoyc0tL7B_uicDfbifg/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
